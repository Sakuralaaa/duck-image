# ---------------------------------------------------------------------------
# DuckAI CPA — 推荐部署方式：极简镜像（Alpine + musl 单文件二进制）
#
#   docker compose up -d --build
#   docker compose logs -f duck-image   # 首次启动打印 adminToken 与默认 API Key
#   # 浏览器打开 http://127.0.0.1:8787/admin/
#
# 镜像由多阶段 Dockerfile 构建：Node 构建 web + 交叉编译 musl 二进制，
# 运行层只有 alpine + ca-certificates + libstdc++ + 二进制（无 Node.js / node_modules）。
# 需要中文 PDF 渲染时：INSTALL_CJK_FONTS=true docker compose build
# ---------------------------------------------------------------------------

services:
  duck-image:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${DUCK_IMAGE_VERSION:-0.1.0}
        INSTALL_CJK_FONTS: ${INSTALL_CJK_FONTS:-false}
    image: duck-image:${DUCK_IMAGE_VERSION:-latest}
    container_name: duck-image
    restart: unless-stopped

    ports:
      - "8787:8787"

    environment:
      # 容器内必须监听 0.0.0.0
      DUCK_IMAGE_HOST: "0.0.0.0"
      DUCK_IMAGE_PORT: "8787"
      DUCK_IMAGE_DATA_DIR: "/data"
      # 强烈建议替换为强随机串；留空则使用 data/config.json 首次生成的 token
      DUCK_IMAGE_ADMIN_TOKEN: "${DUCK_IMAGE_ADMIN_TOKEN:-}"

    volumes:
      - duck-image-data:/data

    # 镜像本体已有 HEALTHCHECK；compose 这里保持一致，便于 docker compose ps 显示健康
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - "http://127.0.0.1:8787/healthz"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    # 给进行中的 SSE 流与原子写留时间
    stop_grace_period: 15s

volumes:
  duck-image-data:
