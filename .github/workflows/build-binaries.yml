name: build-binaries

# 手动构建多平台单文件二进制（Bun `bun build --compile`）。
# 全部目标在对应架构的 GitHub-hosted runner 上原生构建（不做跨 OS/跨架构编译）：
#   windows-latest (x64) / ubuntu-latest (x64) / ubuntu-24.04-arm (arm64) /
#   macos-15-intel (x64) / macos-15 (arm64)。
# 注意：macOS 14 镜像已于 2026-11-02 从 GitHub Actions 下线，macos-13 更早已不可用；
# 用 macos-14/macos-13 会报类似 "configuration 'macos-14-arm64-us-default' is not supported"。
# musl 变体与 glibc 同架构（仅 libc target 不同），在对应架构 runner 上构建；不能在 glibc 上运行，故跳过冒烟。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64
            artifact: duck-image-windows-x64
            binary: dist/windows-x64/duck-image.exe
          - name: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64
            artifact: duck-image-linux-x64
            binary: dist/linux-x64/duck-image
          - name: linux-x64-musl
            os: ubuntu-latest
            target: bun-linux-x64-musl
            artifact: duck-image-linux-x64-musl
            binary: dist/linux-x64-musl/duck-image
            skip_runtime_smoke: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: duck-image-linux-arm64
            binary: dist/linux-arm64/duck-image
          - name: linux-arm64-musl
            os: ubuntu-24.04-arm
            target: bun-linux-arm64-musl
            artifact: duck-image-linux-arm64-musl
            binary: dist/linux-arm64-musl/duck-image
            skip_runtime_smoke: true
          - name: darwin-x64
            os: macos-15-intel
            target: bun-darwin-x64
            artifact: duck-image-darwin-x64
            binary: dist/darwin-x64/duck-image
          - name: darwin-arm64
            os: macos-15
            target: bun-darwin-arm64
            artifact: duck-image-darwin-arm64
            binary: dist/darwin-arm64/duck-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Show toolchain versions
        shell: bash
        run: |
          node --version
          npm --version
          bun --version

      - name: Install dependencies
        run: npm ci

      - name: Build admin console
        run: npm run build:web

      - name: Compile binary (${{ matrix.target }})
        run: node scripts/build-exe.mjs --skip-web-build --target=${{ matrix.target }}

      - name: Check binary (size + magic)
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const f=process.argv[1];const b=fs.readFileSync(f);console.log(f, b.length + ' bytes', 'magic=' + b.subarray(0,4).toString('hex'));" "${{ matrix.binary }}"

      - name: Smoke test binary (HTTP, native platform only)
        if: ${{ !matrix.skip_runtime_smoke }}
        shell: bash
        run: node scripts/verify-exe.mjs --exe "${{ matrix.binary }}" --timeout 90000

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            dist/${{ matrix.name }}/RUN-README.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          {
            echo "### Binary: $TARGET"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- artifact: \`$ARTIFACT\`"
            echo "- binary: \`$BINARY\`"
            echo "- size: $(du -h "$BINARY" | cut -f1)"
            echo "- runtime smoke: $([ "${{ matrix.skip_runtime_smoke }}" = "true" ] && echo "skipped (cross-compiled; verify on target platform)" || echo "verify-exe.mjs")"
          } >> "$GITHUB_STEP_SUMMARY"
