name: ci

# 每次 push / PR：构建管理后台 + 全量离线测试（Node 24 + 文泉驿正黑，与镜像一致；Noto CJK 体积大、PDF 子集化慢，会让 PDF 用例超时）。
on:
  push:
    branches: [main]
    paths-ignore: ['docs-site/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install CJK fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-wqy-zenhei
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - run: npm test
