name: publish-binaries

# 手动构建并发布「多平台单文件二进制」到 GitHub Release。
# 在对应架构的 GitHub-hosted runner 上原生构建：
#   windows-latest / ubuntu-latest / ubuntu-24.04-arm / macos-15-intel / macos-15。
# 注意：macos-13 / macos-14 已从 GitHub Actions 下线（macOS 14 于 2026-11-02 退役），
# 不要使用，否则会出现 "configuration 'macos-14-arm64-us-default' is not supported" 之类的错误。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version（如 v0.1.0）"
        required: true
        type: string
      prerelease:
        description: "标记为 pre-release（不会进入 /releases/latest）"
        required: false
        default: false
        type: boolean
      draft:
        description: "创建为 draft（发布前可人工检查；draft 不进入 /releases/latest）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64
            dir: windows-x64
            asset: duck-image-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64
            dir: linux-x64
            asset: duck-image-linux-x64.tar.gz
          - name: linux-x64-musl
            os: ubuntu-latest
            target: bun-linux-x64-musl
            dir: linux-x64-musl
            asset: duck-image-linux-x64-musl.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: bun-linux-arm64
            dir: linux-arm64
            asset: duck-image-linux-arm64.tar.gz
          - name: linux-arm64-musl
            os: ubuntu-24.04-arm
            target: bun-linux-arm64-musl
            dir: linux-arm64-musl
            asset: duck-image-linux-arm64-musl.tar.gz
          - name: darwin-x64
            os: macos-15-intel
            target: bun-darwin-x64
            dir: darwin-x64
            asset: duck-image-darwin-x64.tar.gz
          - name: darwin-arm64
            os: macos-15
            target: bun-darwin-arm64
            dir: darwin-arm64
            asset: duck-image-darwin-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: npm ci

      - name: Build admin console
        run: npm run build:web

      - name: Compile binary (${{ matrix.target }})
        run: node scripts/build-exe.mjs --skip-web-build --target=${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.dir }}/duck-image.exe", "dist/${{ matrix.dir }}/RUN-README.txt" `
            -DestinationPath "${{ matrix.asset }}"
          Get-Item "${{ matrix.asset }}" | Select-Object Name, Length

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C "dist/${{ matrix.dir }}" -czf "${{ matrix.asset }}" duck-image RUN-README.txt
          ls -lh "${{ matrix.asset }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create / update GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: assets

      - name: Validate inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::invalid version '$VERSION'"
            exit 1
          fi
          test -n "$(ls -A assets)" || { echo "::error::no assets built"; exit 1; }
          ls -lh assets

      - name: Generate release body (download table)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          cat > release-body.md <<EOF
          ## Downloads

          Choose the archive for your platform. Each archive contains \`duck-image\` / \`duck-image.exe\` and \`RUN-README.txt\`.

          | Platform | Download |
          | --- | --- |
          | Windows x64 | [duck-image-windows-x64.zip](${BASE}/duck-image-windows-x64.zip) |
          | Linux x64 (glibc: Debian/Ubuntu) | [duck-image-linux-x64.tar.gz](${BASE}/duck-image-linux-x64.tar.gz) |
          | Linux x64 (musl: Alpine) | [duck-image-linux-x64-musl.tar.gz](${BASE}/duck-image-linux-x64-musl.tar.gz) |
          | Linux arm64 (glibc) | [duck-image-linux-arm64.tar.gz](${BASE}/duck-image-linux-arm64.tar.gz) |
          | Linux arm64 (musl: Alpine) | [duck-image-linux-arm64-musl.tar.gz](${BASE}/duck-image-linux-arm64-musl.tar.gz) |
          | macOS Intel | [duck-image-darwin-x64.tar.gz](${BASE}/duck-image-darwin-x64.tar.gz) |
          | macOS Apple Silicon | [duck-image-darwin-arm64.tar.gz](${BASE}/duck-image-darwin-arm64.tar.gz) |

          ## Quick start

          - **Windows**: unzip and double-click \`duck-image.exe\` (console window stays open).
          - **Linux / macOS**: \`tar -xzf <archive>\`, then \`chmod +x duck-image && ./duck-image\`.
          - First start creates \`data/config.json\` and prints an admin token + default API key once.
          - Admin console: http://127.0.0.1:8787/admin/ — data directory: next to the binary (\`data/\`).
          - Binaries are unsigned: Windows SmartScreen / macOS Gatekeeper may warn.

          > Docker is recommended for servers — see the GHCR image in the README.
          > Details: [docs/BINARY-BUILDS.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/BINARY-BUILDS.md)
          EOF
          cat release-body.md

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          # -x：把每条命令打印到日志，便于定位发布失败的具体命令
          set -euxo pipefail
          trap 'echo "::error::release publish failed"; gh api "repos/${GH_REPO}/releases/tags/${VERSION}" --jq "{url:.html_url,draft:.draft,assets:[.assets[].name]}" 2>/dev/null || true' ERR

          release_exists=0
          if gh api "repos/${GH_REPO}/releases/tags/${VERSION}" >/dev/null 2>&1; then
            release_exists=1
          else
            # release-by-tag 对某些 draft 可能返回 404；再从 releases 列表里按 tag_name 找（含 draft）
            existing_ids=$(gh api "repos/${GH_REPO}/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"${VERSION}\") | .id" 2>/dev/null || true)
            if [[ -n "$existing_ids" ]]; then
              release_exists=1
            fi
          fi

          if [[ "$release_exists" == "1" ]]; then
            gh release upload "$VERSION" assets/* --clobber --repo "$GH_REPO"
            gh release edit "$VERSION" --notes-file release-body.md --repo "$GH_REPO"
            if [[ "$DRAFT" == "true" ]]; then
              echo "::warning::release $VERSION already exists; --draft 仅对新建 release 生效，已发布 release 不能回退为 draft"
            fi
            echo "Release $VERSION already exists; assets and download table updated."
          else
            args=(--repo "$GH_REPO" --title "$VERSION" --notes-file release-body.md)
            # tag 已存在时用 --verify-tag（不要在已有 tag 上再指定 target）；否则用当前提交创建 tag
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
              args+=(--verify-tag)
            else
              args+=(--target "$GITHUB_SHA")
            fi
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            if [[ "$DRAFT" == "true" ]]; then
              args+=(--draft)
            fi
            if ! gh release create "$VERSION" "${args[@]}" assets/*; then
              echo "::warning::gh release create failed; retrying as existing release upload"
              gh release upload "$VERSION" assets/* --clobber --repo "$GH_REPO"
              gh release edit "$VERSION" --notes-file release-body.md --repo "$GH_REPO"
            fi
            echo "Release $VERSION created (draft=${DRAFT})."
          fi

          gh api "repos/${GH_REPO}/releases/tags/${VERSION}" \
            --jq '{url: .html_url, tag: .tag_name, draft: .draft, prerelease: .prerelease, assets: [.assets[].name]}' \
            || echo "::warning::could not read final release state (release was created/updated above)"

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          {
            echo "### Binaries published"
            echo ""
            echo "- release: \`$VERSION\`"
            echo "- page: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
            echo "- draft: \`$DRAFT\` (draft 需在 GitHub 上手动 Publish；publish 后才会出现在 /releases/latest)"
            echo "- latest download page: https://github.com/${{ github.repository }}/releases/latest"
            echo "- assets:"
            echo '```'
            ls -1 assets
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
